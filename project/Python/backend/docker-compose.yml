version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-training-backend
    ports:
      - "8000:8000"
    environment:
      - DB_TYPE=sqlite
      - DB_SQLITE_PATH=/data/app.db
      - DEBUG=False
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./app:/app/app
      - backend_data:/data
    networks:
      - ai-training-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (Optional)
  postgres:
    image: postgres:15-alpine
    container_name: ai-training-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_training
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-training-network
    profiles:
      - postgres

  # MSSQL Server (Optional)
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ai-training-mssql
    environment:
      SA_PASSWORD: "SaPassword123!"
      ACCEPT_EULA: Y
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - ai-training-network
    profiles:
      - mssql

  # Angular Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai-training-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - ai-training-network
    environment:
      - API_URL=http://backend:8000

networks:
  ai-training-network:
    driver: bridge

volumes:
  backend_data:
    driver: local
  postgres_data:
    driver: local
  mssql_data:
    driver: local
